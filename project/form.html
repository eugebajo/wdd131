<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Zana | Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css" media="screen and (min-width: 768px)">
    <script defer src="scripts/form.js"></script>
</head>
<body>
    <header>
        <h1>Team Zana Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get" id="reviewForm">
            <fieldset>
                <legend>Leave Your Review</legend>

                <!-- Product Name -->
                <label for="productName">Product Name:</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a product...</option>
                </select>

                <!-- Overall Rating -->
                <label>Overall Rating:</label>
                <div class="rating">
                    <input type="radio" id="rate1" name="rating" value="1" required>
                    <label for="rate1">★</label>

                    <input type="radio" id="rate2" name="rating" value="2">
                    <label for="rate2">★★</label>

                    <input type="radio" id="rate3" name="rating" value="3">
                    <label for="rate3">★★★</label>

                    <input type="radio" id="rate4" name="rating" value="4">
                    <label for="rate4">★★★★</label>

                    <input type="radio" id="rate5" name="rating" value="5">
                    <label for="rate5">★★★★★</label>
                </div>

                <!-- Date of Enrollment -->
                <label for="installDate">Date of Enrollment:</label>
                <input type="date" id="installDate" name="installDate" required>

                <!-- Useful Features -->
                <fieldset>
                    <legend>Useful Features (check all that apply):</legend>
                    <input type="checkbox" id="feature1" name="features" value="Nutrition Plan">
                    <label for="feature1">Nutrition Plan</label><br>

                    <input type="checkbox" id="feature2" name="features" value="Workout Videos">
                    <label for="feature2">Workout Videos</label><br>

                    <input type="checkbox" id="feature3" name="features" value="Personal Coaching">
                    <label for="feature3">Personal Coaching</label><br>

                    <input type="checkbox" id="feature4" name="features" value="Progress Tracking">
                    <label for="feature4">Progress Tracking</label>
                </fieldset>

                <!-- Written Review -->
                <label for="reviewText">Written Review:</label>
                <textarea id="reviewText" name="reviewText" placeholder="Write your review here..."></textarea>

                <!-- User Name -->
                <label for="userName">Your Name (optional):</label>
                <input type="text" id="userName" name="userName">

                <!-- Submit Button -->
                <input type="submit" value="Submit Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Maria Eugenia Baez. All rights reserved.</p>
    </footer>
</body>
</html>
