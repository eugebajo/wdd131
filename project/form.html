<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product Review Form Page">
  <meta name="author" content="Maria Eugenia Baez">
  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/form.css" media="screen and (max-width: 767px)">
  <link rel="stylesheet" href="styles/form-large.css" media="screen and (min-width: 768px)">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <img src="images/make-abrazos-logo.png" alt="Logo" class="logo">
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <label for="productName">Product Name:</label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset>
        <legend>Overall Rating:</legend>
        <div class="stars">
          <label><input type="radio" name="rating" value="1" required> ☆</label>
          <label><input type="radio" name="rating" value="2"> ☆☆</label>
          <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
          <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
          <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
        </div>
      </fieldset>

      <label for="installDate">Date of Installation:</label>
      <input type="date" id="installDate" name="installDate" required>

      <fieldset>
        <legend>Useful Features:</legend>
        <label><input type="checkbox" id="feature1" name="features" value="Feature A"> Feature A</label>
        <label><input type="checkbox" id="feature2" name="features" value="Feature B"> Feature B</label>
        <label><input type="checkbox" id="feature3" name="features" value="Feature C"> Feature C</label>
      </fieldset>

      <label for="review">Written Review:</label>
      <textarea id="review" name="review" rows="4" placeholder="Write your review..."></textarea>

      <label for="username">Your Name (optional):</label>
      <input type="text" id="username" name="username" placeholder="John Doe">

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> - Maria Eugenia Baez</p>
    <p>Last Modification: <span id="modDate"></span></p>
  </footer>
</body>
</html>
