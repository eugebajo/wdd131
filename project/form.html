<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product Review Form - WDD 131">
  <meta name="author" content="Maria Eugenia Baez">
  <title>Product Review</title>

  <link rel="stylesheet" href="styles/form.css" media="screen and (max-width: 767px)">
  <link rel="stylesheet" href="styles/form-large.css" media="screen and (min-width: 768px)">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <script defer src="scripts/form.js"></script>
</head>
<body>
  <header>
    <h1>Product Review Form</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <label for="product">Product Name:</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
        <!-- JS inserts options here -->
      </select>

      <fieldset>
        <legend>Overall Rating:</legend>
        <label><input type="radio" name="rating" id="rate1" value="1" required /> 1 ★</label>
        <label><input type="radio" name="rating" id="rate2" value="2" /> 2 ★★</label>
        <label><input type="radio" name="rating" id="rate3" value="3" /> 3 ★★★</label>
        <label><input type="radio" name="rating" id="rate4" value="4" /> 4 ★★★★</label>
        <label><input type="radio" name="rating" id="rate5" value="5" /> 5 ★★★★★</label>
      </fieldset>

      <label for="install-date">Date of Installation:</label>
      <input type="date" id="install-date" name="install-date" required />

      <fieldset>
        <legend>Useful Features (Check all that apply):</legend>
        <label><input type="checkbox" id="feature1" name="features" value="durability" /> Durability</label>
        <label><input type="checkbox" id="feature2" name="features" value="design" /> Design</label>
        <label><input type="checkbox" id="feature3" name="features" value="efficiency" /> Efficiency</label>
        <label><input type="checkbox" id="feature4" name="features" value="price" /> Price</label>
      </fieldset>

      <label for="review">Written Review:</label>
      <textarea id="review" name="review" rows="5" placeholder="Write your review here..."></textarea>

      <label for="username">Your Name:</label>
      <input type="text" id="username" name="username" />

      <input type="submit" value="Submit Review" />
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> - Maria Eugenia Baez</p>
    <p>Last Modification: <span id="modDate"></span></p>
  </footer>
</body>
</html>
